name: Build
run-name: ${{ github.event.inputs.version }} Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        default: ""

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        shell: bash
        run: |
          # Validate the version before using it as a tag and archive name.
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            echo "Tag already exists: $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          # Collect commit first lines since the previous tag.
          set -euo pipefail

          # The new release tag is created after this step.
          previous_tag="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
          range="HEAD"
          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..HEAD"
          fi

          commits="$(git log "$range" --format=%H)"
          if [ -z "$commits" ]; then
            commits="$(git rev-parse HEAD)"
          fi

          {
            echo 'changelog<<EOF'
            while IFS= read -r commit; do
              # %s folds a multiline first paragraph; use the actual first line.
              subject="$(git show -s --format=%B "$commit" | sed -n '1p')"
              short_sha="$(git rev-parse --short "$commit")"
              printf -- '- %s ([%s](%s/%s/commit/%s))\n' \
                "$subject" "$short_sha" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$commit"
            done <<< "$commits"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]
    env:
      BUILD_CONFIG: ${{ matrix.config }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          # Configure the Windows build with the release version.
          cmake -S src -B build -G "Ninja Multi-Config" "-DOPENSTEAMTOOL_VERSION=$env:RELEASE_VERSION"

      - name: Build
        shell: pwsh
        run: |
          # Build the variant assigned to this matrix job.
          cmake --build build --config "$env:BUILD_CONFIG" --parallel

      - name: Package
        shell: pwsh
        run: |
          # Package the selected Windows x64 variant.
          7z a "OpenSteamTool-$env:RELEASE_VERSION-windows-x64-$env:BUILD_CONFIG.zip" ".\build\$env:BUILD_CONFIG\*" -mx5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.config }}
          path: OpenSteamTool-*.zip
          if-no-files-found: error

  build-macos:
    needs: prepare
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]
    env:
      BUILD_CONFIG: ${{ matrix.config }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build
        shell: bash
        run: |
          # Build the selected arm64 variant in its own single-config tree.
          set -euo pipefail
          cmake -S src -B "build/macos/$BUILD_CONFIG" -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE="$BUILD_CONFIG" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DOPENSTEAMTOOL_VERSION="$RELEASE_VERSION"
          cmake --build "build/macos/$BUILD_CONFIG" --parallel "$(sysctl -n hw.logicalcpu)"

      - name: Package
        shell: bash
        run: |
          # Ship the portable launcher beside the dylib, plus Debug symbols.
          set -euo pipefail
          export COPYFILE_DISABLE=1
          package_dir="$RUNNER_TEMP/package-$BUILD_CONFIG"
          mkdir -p "$package_dir"
          cp "build/macos/$BUILD_CONFIG/libOpenSteamTool.dylib" "$package_dir/"
          cp tools/macos/steam-inject.sh opensteamtool.example.toml "$package_dir/"
          chmod +x "$package_dir/steam-inject.sh"
          if [ "$BUILD_CONFIG" = Debug ]; then
            cp -R "build/macos/$BUILD_CONFIG/libOpenSteamTool.dylib.dSYM" "$package_dir/"
          fi
          (cd "$package_dir" && zip -qry -X \
            "$GITHUB_WORKSPACE/OpenSteamTool-$RELEASE_VERSION-macos-arm64-$BUILD_CONFIG.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.config }}
          path: OpenSteamTool-*.zip
          if-no-files-found: error

  release:
    needs: [prepare, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Verify packages and create tag
        shell: bash
        run: |
          # Publish a tag only after all four archives are available.
          set -euo pipefail
          for suffix in windows-x64-Release windows-x64-Debug macos-arm64-Release macos-arm64-Debug; do
            test -s "dist/OpenSteamTool-$RELEASE_VERSION-$suffix.zip"
          done
          git tag "$RELEASE_VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          body: |
            ## Changes

            ${{ needs.prepare.outputs.changelog }}

            ## Installation

            Fully exit Steam before installing or updating.

            ### Windows (x64)

            Download `OpenSteamTool-${{ github.event.inputs.version }}-windows-x64-Release.zip` (or the `-Debug` variant for logging).

            Copy `dwmapi.dll` and `xinput1_4.dll` to your Steam root directory (e.g. `C:\Program Files (x86)\Steam`). Place `OpenSteamTool.dll` in `%LOCALAPPDATA%\OpenSteamTool\bin\` (create the directory if needed).

            Place Lua scripts in `%LOCALAPPDATA%\OpenSteamTool\lua\`. Debug logs are saved to `%LOCALAPPDATA%\OpenSteamTool\logs\`.

            ### macOS (Apple Silicon)

            Download `OpenSteamTool-${{ github.event.inputs.version }}-macos-arm64-Release.zip` (or the `-Debug` variant for logging and debug symbols).

            Extract the archive and keep `steam-inject.sh` beside `libOpenSteamTool.dylib`. With Steam installed at `/Applications/Steam.app`, open a terminal in the extracted folder and run `bash ./steam-inject.sh` to launch Steam with OpenSteamTool.

            The script backs up and ad-hoc re-signs Steam's executable. To restore the original signature, exit Steam and run `bash ./steam-inject.sh --restore`.

            Place Lua scripts in `~/Library/Application Support/OpenSteamTool/lua/`. Debug logs are saved to `~/Library/Application Support/OpenSteamTool/logs/`.

            On both platforms, `OST_DATA_DIR` overrides the default OpenSteamTool data directory.
          fail_on_unmatched_files: true
          files: |
            dist/OpenSteamTool-${{ github.event.inputs.version }}-windows-x64-Release.zip
            dist/OpenSteamTool-${{ github.event.inputs.version }}-windows-x64-Debug.zip
            dist/OpenSteamTool-${{ github.event.inputs.version }}-macos-arm64-Release.zip
            dist/OpenSteamTool-${{ github.event.inputs.version }}-macos-arm64-Debug.zip
